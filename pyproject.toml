[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "fingerino"
version = "0.1.0"
description = "Control your computer with webcam hand gestures — move, click, scroll and window shortcuts, no extra hardware."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "cky" }]
keywords = [
    "hand-tracking", "gesture-recognition", "mediapipe", "webcam",
    "mouse", "opencv", "computer-vision", "accessibility",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX :: Linux",
    "Operating System :: MacOS",
    "Programming Language :: Python :: 3",
    "Topic :: Multimedia :: Video :: Capture",
    "Topic :: Scientific/Engineering :: Image Recognition",
]
dependencies = [
    "mediapipe>=0.10.9",
    "opencv-python>=4.9",
    "pynput>=1.7.6",
    "numpy>=1.26",
    "pillow>=10.0",
]

# Everything packaging/build.py needs on top of the runtime deps.
[project.optional-dependencies]
build = ["pyinstaller>=6.0"]

[project.urls]
Homepage = "https://github.com/cky-gitHub/fingerino"
Repository = "https://github.com/cky-gitHub/fingerino"
Issues = "https://github.com/cky-gitHub/fingerino/issues"

# Installs a `fingerino` command on the PATH.
[project.scripts]
fingerino = "fingerino.main:main"

[tool.setuptools]
packages = ["fingerino"]
