# Keeps the pinned GitHub Actions (pinned to commit SHAs in the workflows)
# and the release build's Python pins current, through reviewable PRs.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]

  - package-ecosystem: pip
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    ignore:
      # Held at 0.10.33 on purpose: 0.10.35+ carries Google's telemetry
      # uploader (google-ai-edge/mediapipe#6291, tests/test_no_telemetry.py),
      # and 1.x is blocked by Windows Smart App Control (see pyproject.toml).
      - dependency-name: mediapipe
