name: Release

# Push a tag to cut a release:
#     git tag v0.1.0 && git push origin v0.1.0
#
# Builds the installers on real Windows / Apple Silicon Mac runners —
# PyInstaller cannot cross-compile, so there is one job per target — and
# attaches them to a GitHub Release people can download and open.
#
# Run it from the Actions tab (workflow_dispatch) to test a build without
# publishing anything; the artifacts are uploaded either way.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write        # needed to create the release

jobs:
  build:
    name: ${{ matrix.label }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            label: windows-x64
          - os: macos-latest       # Apple Silicon
            label: macos-arm64
          # No Intel Mac build: MediaPipe stopped publishing x86_64 macOS
          # wheels after 0.10.21, which needs NumPy 1.x and protobuf 4 -- a
          # second, untested dependency set. Apple Silicon only.

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # The file names come from __version__, not the tag, so tagging v0.2.0
      # without bumping it would publish a release full of 0.1.0 files. Read
      # with a regex rather than an import: nothing is installed yet.
      - name: Check the tag matches __version__
        if: startsWith(github.ref, 'refs/tags/')
        shell: python
        run: |
          import os, re
          tag = os.environ["GITHUB_REF_NAME"]
          src = open("fingerino/__init__.py", encoding="utf-8").read()
          version = re.search(r'^__version__ = "([^"]+)"', src, re.M).group(1)
          if tag != f"v{version}":
              print(f"::error::Tag {tag} does not match __version__ {version}. "
                    f"Bump fingerino/__init__.py to {tag.lstrip('v')}, merge it, "
                    f"and tag that commit -- see docs/releasing.md.")
              raise SystemExit(1)
          print(f"tag {tag} matches __version__ {version}")

      # Pinned, not resolved: requirements-build.txt is what makes a tag
      # reproducible. --no-deps for the project itself so nothing in
      # pyproject.toml's loose ranges can quietly override a pin.
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-build.txt
          python -m pip install --no-deps .

      - name: Install Inno Setup
        if: runner.os == 'Windows'
        run: choco install innosetup --no-progress -y

      - name: Build
        env:
          # Set these as repository secrets to ship a signed, notarized Mac
          # app. Without them the build still succeeds, ad-hoc signed, and
          # users click through Gatekeeper once (see the README).
          APPLE_DEVELOPER_ID: ${{ secrets.APPLE_DEVELOPER_ID }}
          APPLE_NOTARY_PROFILE: ${{ secrets.APPLE_NOTARY_PROFILE }}
        run: python packaging/build.py

      # The runners have no webcam, so the app itself can't be launched — and
      # a failed camera open raises a modal dialog nothing would ever dismiss.
      # --selftest loads MediaPipe and the bundled model with no camera and no
      # window, which is the part that actually breaks in a packaged build.
      - name: Selftest the packaged app
        shell: python
        run: |
          import glob, os, subprocess, sys

          exe = ("dist/Fingerino/Fingerino.exe" if sys.platform == "win32"
                 else "dist/Fingerino.app/Contents/MacOS/Fingerino")
          assert os.path.exists(exe), f"no executable at {exe}"
          assert glob.glob("dist/release/*"), "nothing in dist/release"

          done = subprocess.run([exe, "--selftest"], timeout=300,
                                capture_output=True, text=True)
          print("exit code:", done.returncode)
          for name, stream in (("stdout", done.stdout), ("stderr", done.stderr)):
              if stream and stream.strip():
                  print(f"--- {name} ---")
                  print(stream.strip())

          # The app is built without a console, so on a windowed build the
          # report only exists on disk.
          cache = (os.path.join(os.environ["LOCALAPPDATA"], "fingerino")
                   if sys.platform == "win32"
                   else os.path.expanduser("~/Library/Caches/fingerino"))
          report = os.path.join(cache, "selftest.txt")
          if os.path.exists(report):
              print("--- report ---")
              print(open(report, encoding="utf-8").read())

          # MediaPipe's detection graph reaches for a Metal device on Apple
          # Silicon, and the hosted Mac runners are headless VMs with none —
          # the calculator dies on a C++ CHECK ("Service is unavailable")
          # before Python can catch anything. That is the runner's limit, not
          # a broken bundle, so fall back to proving the payload is complete
          # and leave real hardware as the real test.
          if sys.platform == "darwin" and "Service is unavailable" in (done.stderr or ""):
              print("::warning::This runner has no Metal GPU, so MediaPipe "
                    "could not be exercised. Verify this build on a real Mac.")
              model = glob.glob("dist/Fingerino.app/**/hand_landmarker.task",
                                recursive=True)
              assert model, "the model is missing from the .app"
              print("bundled model present:", model[0])
          else:
              assert done.returncode == 0, f"selftest exited {done.returncode}"

          print("release files:", os.listdir("dist/release"))

      - uses: actions/upload-artifact@v4
        with:
          name: fingerino-${{ matrix.label }}
          path: dist/release/*
          if-no-files-found: error

  release:
    name: Publish release
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      # The notes are composed to a file rather than piped straight in, because
      # the checksum block below has to be appended after the artifacts exist.
      - name: Compose the release notes
        run: |
          cat > notes.md <<'NOTES'
          ## Download

          | Your machine | File | What to do |
          | --- | --- | --- |
          | Windows 10 / 11 | `...-windows-x64-Setup.exe` | Run it, then launch Fingerino |
          | Mac (Apple Silicon) | `...-macos-arm64.dmg` | Open it, drag Fingerino to Applications |

          Not sure which Mac you have? Apple menu → About This Mac: "Apple M…"
          means Apple Silicon. Intel Macs are not supported — MediaPipe, the
          hand tracker, no longer ships for them.

          ### First launch

          These builds aren't code-signed, so your OS asks once:

          - **Windows** — SmartScreen shows a blue box. Click **More info → Run anyway**.
          - **macOS** — the app is blocked. Open **System Settings → Privacy &
            Security**, scroll down, and press **Open Anyway**.

          Fingerino needs **camera** access on both platforms, and on macOS also
          **Accessibility** (System Settings → Privacy & Security →
          Accessibility) before it can move the cursor. It'll prompt you.

          Video is processed on your machine and never leaves it. These builds
          contain the hand model already, so they make no network request at
          all. See the README's Privacy section and SECURITY.md.
          NOTES

          # Neither installer is signed, so the OS cannot vouch for these files.
          # Publishing the digests gives anyone who cares a way to check the
          # download they got is the one this workflow actually produced.
          {
            printf '\n### Verify your download\n\n'
            printf 'Optional, but these are the SHA-256 digests this build produced:\n\n'
            printf '```\n'
            ( cd artifacts && sha256sum -- * )
            printf '```\n\n'
            printf 'Windows: `Get-FileHash <file>` — macOS: `shasum -a 256 <file>`\n'
          } >> notes.md

      - name: Create the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            --title "Fingerino ${GITHUB_REF_NAME}" \
            --notes-file notes.md
          gh release upload "${GITHUB_REF_NAME}" artifacts/*

      # Version-less copies give a website a link that never goes stale:
      #   https://github.com/<owner>/<repo>/releases/latest/download/Fingerino-windows-x64-Setup.exe
      # Uploaded after the notes are written, so the checksums above list each
      # build once. The copies are byte-identical, so the same digests apply.
      - name: Attach stable-named copies
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          mkdir stable
          for f in artifacts/*; do
            name=$(basename "$f" | sed -E 's/^Fingerino-[^-]+-/Fingerino-/')
            cp "$f" "stable/$name"
          done
          ls stable
          gh release upload "${GITHUB_REF_NAME}" stable/*
