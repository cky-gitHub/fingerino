name: CI

# Runs on every push and pull request, which is the gap this fills: until now
# the only workflow was Release, so a syntax error or a broken import first
# showed up when a tag was cut and the installers were already building.

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

# A new push supersedes the run already going for the same branch.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # Fast gate. gesture_detector.py and config.py import nothing but the
  # standard library, and mypy is configured to ignore missing stubs, so the
  # whole of this runs without MediaPipe or OpenCV — in seconds rather than
  # minutes. Tests needing pynput or MediaPipe skip themselves here and are
  # covered by the Windows job below.
  lint:
    name: lint, types, pure unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: python -m pip install --upgrade pip
      - run: python -m pip install ruff mypy pytest

      - name: Ruff
        run: ruff check fingerino packaging tests

      - name: Mypy
        run: mypy

      - name: Pytest (dependency-free subset)
        run: pytest -q

  # The real thing, on the platform most people will run it on. Installs the
  # same pinned set the release build uses, so a lockfile that no longer
  # resolves fails here instead of at tag time.
  windows:
    name: full tests + selftest (windows)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-build.txt

      - run: python -m pip install --upgrade pip
      - run: python -m pip install -r requirements-build.txt pytest
      - run: python -m pip install --no-deps .

      - name: Pytest (full suite)
        run: pytest -q

      # No webcam on a runner, so the app itself cannot start. --selftest
      # covers the part that actually breaks: MediaPipe loading, the model
      # download and its checksum, and screen metrics.
      - name: Selftest
        run: python -m fingerino --selftest

# macOS is deliberately not built here. Hosted macOS minutes bill at ten times
# the Linux rate, and release.yml already runs a full build and selftest on
# both Apple Silicon and Intel for every tag.
